name: CI

on:
  push:
    branches: [main, master, dev, "phase*"]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Ruff Lint Check (whole repo)
        run: |
          ruff check . --output-format=github

      - name: Validate training launchers
        run: |
          bash -n data/sft/train_planner_student.sh
          bash -n data/sft/run_planner_contrast.sh

      - name: Run Unit Tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history for scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate CPU, CUDA, and ROCm Compose profiles
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.amd.yml config --quiet

      - name: Validate ModelScope launch scripts
        run: |
          bash -n deploy/modelscope_space/start_amd_35b.sh
          bash -n deploy/modelscope_space/start_space_amd.sh
