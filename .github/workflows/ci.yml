name: CI

on:
  push:
    branches: [main, master, dev, "phase*"]
  pull_request:
    branches: [main, master]

jobs:
  music-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-mcp.txt pytest
      - run: python -m pytest tests/mcp -q
      - run: pip check

  local-gradio:
    runs-on: ubuntu-latest
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-local-ui.txt
      - run: python -m unittest discover -s tests/gradio -v
      - run: pip check

  neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.03.1-community
        env:
          NEO4J_AUTH: none
        ports:
          - 27687:7687
        options: >-
          --health-cmd "cypher-shell 'RETURN 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      SOULTUNER_AUDIT_NEO4J: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/integration/test_audit_neo4j.py -v --tb=short

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Ruff Lint Check (whole repo)
        run: |
          ruff check . --output-format=github

      - name: Validate training launchers
        run: |
          bash -n data/sft/train_planner_student.sh
          bash -n data/sft/run_planner_contrast.sh

      - name: Run Unit Tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install and build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history for scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate CPU, CUDA, and ROCm Compose profiles
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.amd.yml config --quiet

      - name: Validate ModelScope launch scripts
        run: |
          bash -n deploy/modelscope_space/start_amd_35b.sh
          bash -n deploy/modelscope_space/start_space_amd.sh
