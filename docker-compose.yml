# ============================================================
# SoulTuner-Agent Docker Compose
# 一键启动所有服务: docker compose up -d
# ============================================================

name: soultuner-agent

# ★ 所有对外端口默认只绑定 127.0.0.1（仅本机可访问）。Docker 未指定 host IP 时会
#   绑定到 0.0.0.0（整个局域网可达），而本项目默认关闭鉴权，两者叠加会把设置修改、
#   记忆删除等接口暴露给同网段任何人。项目没有登录流程，兜不住这种情况，
#   所以请保持 BIND_HOST=127.0.0.1，要远程访问走 VPN 或 SSH 隧道。

services:
  # ---- Neo4j 图数据库 ----
  neo4j:
    # 默认 Community：全新安装拿到的是空卷，Community 足够跑完整功能，且不需要
    # 接受任何 Enterprise 许可证。本仓库不替使用者接受商业许可证。
    #
    # ★ 已有数据卷请在本地 .env 里改回 Enterprise：老卷用的是 Enterprise 专有的
    #   `block` 存储格式（SHOW DATABASES 里显示 store = block-block-1.1），
    #   Community 只支持 `aligned`，把 block 卷交给 Community 会直接启动失败——
    #   这不是版本降级而是存储格式不兼容，必须离线迁移，见 docs/NEO4J_MIGRATION.md。
    #     NEO4J_IMAGE=neo4j:2026-enterprise
    #     NEO4J_ACCEPT_LICENSE_AGREEMENT=eval   # 或 yes，取决于你持有哪种许可证
    image: ${NEO4J_IMAGE:-neo4j:2026.03.1-community}
    container_name: soultuner-neo4j
    ports:
      - "${BIND_HOST:-127.0.0.1}:7474:7474"       # Neo4j Browser (http://localhost:7474)
      - "${BIND_HOST:-127.0.0.1}:7687:7687"       # Bolt 协议
    environment:
      # ★ 口令从 .env 读取（NEO4J_PASSWORD）。首次部署请在 .env 设置强口令；下方默认仅为本地开发兜底。
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme_dev_only}
      # 故意不给默认值：Community 会忽略它；换成 Enterprise 镜像却没显式设置时，
      # 容器会打印许可证全文并拒绝启动——由使用者自己选 yes（持有商业许可证）
      # 还是 eval（Neo4j 评估许可证，非生产、有期限）。
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # 如果有 dump 文件，挂载到 /seed 用于首次恢复
      # - ./docker/neo4j-seed:/seed
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- GraphZep 记忆旁路（legacy，已停用为默认依赖）----
  # 产品决策：默认记忆为本地结构化账本（L0/L1/L2），不构建/启动/评测 GraphZep。
  # 此服务仅作 legacy 兼容保留（profile=memory，默认永不启动）。
  graphzep:
    profiles: ["memory"]
    build: ./graphzep_service
    container_name: soultuner-graphzep
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:3100:3100"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme_dev_only}"
      OPENAI_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_API_KEY: ${DASHSCOPE_API_KEY}
      MODEL_NAME: ${GRAPHZEP_MODEL_NAME:-qwen3.7-plus}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      PORT: "3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- Qdrant 知识库向量后端（默认启动的 RAG 服务）----
  # SQLite 保存可审计原文与来源；Qdrant 保存知识卡摘要向量，
  # 供 Catalog Gap / 歌手背景 / 风格知识查询做语义召回。
  qdrant:
    profiles: ["rag"]
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.5}
    container_name: soultuner-qdrant
    ports:
      - "${BIND_HOST:-127.0.0.1}:6333:6333"
      - "${BIND_HOST:-127.0.0.1}:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ---- Python 后端 API ----
  backend:
    build: .
    container_name: soultuner-backend
    # 运行时从项目私有 .env 注入密钥；.env 已被 Git 与 Docker build context 排除。
    # 密钥改由下面的 environment 从宿主机(用户级)环境变量透传；.env 里不再有明文。
    # compose 中 environment 优先级高于 env_file，所以那组是权威来源。
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:8501:8501"
    environment:
      # 密钥透传：值来自宿主机环境变量，不落在仓库任何文件里。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SiliconFlow_API_KEY: ${SiliconFlow_API_KEY}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme_dev_only}"
      GRAPHZEP_BASE_URL: http://graphzep:3100
      MEMORY_EPISODIC_BACKENDS: ${MEMORY_EPISODIC_BACKENDS:-}
      MODEL_NAME: ${MODEL_NAME:-qwen3.7-plus}
      # soultuner.ps1 按 CPU/GPU profile 注入 m2d/muq；直接 compose 时可由 .env 覆盖。
      DENSE_TEXT_AUDIO_BACKEND: ${DENSE_TEXT_AUDIO_BACKEND:-m2d}
      MUSIC_M2D_MODEL_WARMUP: ${MUSIC_M2D_MODEL_WARMUP:-true}
      MUSIC_AUDIO_DATA_DIR: /app/data/processed_audio/audio
      MUSIC_DATA_ROOT: /app/data
      MUSIC_FEEDBACK_DIR: /app/data/feedback
      MUSIC_USER_SETTINGS_PATH: /app/data/config/user_settings.json
      MUSIC_KNOWLEDGE_STORE_PATH: /app/data/knowledge_cache/music_knowledge.sqlite
      MUSIC_KNOWLEDGE_CACHE_PATH: /app/data/knowledge_cache/music_knowledge.jsonl
      MUSIC_KNOWLEDGE_VECTOR_BACKEND: ${MUSIC_KNOWLEDGE_VECTOR_BACKEND:-qdrant}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MUSIC_KNOWLEDGE_QDRANT_COLLECTION: ${MUSIC_KNOWLEDGE_QDRANT_COLLECTION:-soultuner_music_knowledge}
      MUSIC_KNOWLEDGE_QDRANT_TIMEOUT_SECONDS: ${MUSIC_KNOWLEDGE_QDRANT_TIMEOUT_SECONDS:-0.8}
      FEEDBACK_LOG_RAW_QUERY: ${FEEDBACK_LOG_RAW_QUERY:-0}
      MUSIC_WEB_SEARCH_ENABLED: "1"
      MUSIC_INLINE_INGEST_ENABLED: "0"
      MUSIC_INGEST_QUEUE_DIR: /app/data/ingest_queue
      NETEASE_API_BASE: http://netease:3000
      # 默认允许缺失的 HuggingFace 文本编码器自动下载，保证 CPU/GPU 一键启动后向量检索可用。
      # 如需完全离线运行，可在 .env 设置 HF_OFFLINE=true 并提前准备本地缓存。
      HF_OFFLINE: ${HF_OFFLINE:-false}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface/hub
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      # 本地模型推理（可选，通过宿主机暴露的 vLLM 端口）
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
    volumes:
      # 音乐数据：挂载宿主机的音频/封面/歌词目录
      - ${MUSIC_DATA_PATH:-./data}:/app/data
      # M2D-CLAP 模型权重：挂载宿主机缓存，供语义精排与 MuQ 失败回退使用。
      - ${M2D_CLAP_CACHE:-~/.cache/m2d_clap}:/root/.cache/m2d_clap
      # HuggingFace 模型缓存：包含 MuQ-MuLan 权重，避免容器重复下载。
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s  # 模型默认懒加载；健康检查不等待模型权重加载。

  # ---- 离线音乐增强 Worker（GPU 模式）----
  # 在线 API 只写元数据和任务队列；该 Worker 独立完成歌词标签与音频向量提取。
  ingest-worker:
    profiles: ["gpu"]
    build: .
    container_name: soultuner-ingest-worker
    command: ["python", "scripts/ingest_worker.py", "--watch"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme_dev_only}"
      MUSIC_INGEST_QUEUE_DIR: /app/data/ingest_queue
      MUSIC_DATA_ROOT: /app/data
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      HF_OFFLINE: ${HF_OFFLINE:-false}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface/hub
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
    volumes:
      - ${MUSIC_DATA_PATH:-./data}:/app/data
      - ${M2D_CLAP_CACHE:-~/.cache/m2d_clap}:/root/.cache/m2d_clap
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from pathlib import Path; Path('/app/data/ingest_queue').mkdir(parents=True, exist_ok=True)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---- 联网元搜索（CPU / GPU 模式）----
  searxng:
    profiles: ["cpu", "gpu"]
    image: searxng/searxng:latest
    container_name: soultuner-searxng
    ports:
      - "${BIND_HOST:-127.0.0.1}:8888:8080"
    restart: unless-stopped

  # ---- 网易云音乐代理（CPU / GPU 模式）----
  netease:
    profiles: ["cpu", "gpu"]
    image: binaryify/netease_cloud_music_api:v4.26.0
    container_name: soultuner-netease
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    restart: unless-stopped

  # ---- Next.js 前端 ----
  frontend:
    build: ./web
    container_name: soultuner-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:3003:3003"
    environment:
      # 浏览器侧：跑在宿主机上，用发布出来的端口
      NEXT_PUBLIC_API_URL: http://localhost:8501
      # 注意：服务端 rewrite 的目标在 web/Dockerfile 里设（构建期），
      # 放在这里是无效的——next build 已经把它冻进 routes-manifest.json 了。
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
